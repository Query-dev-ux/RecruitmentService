# Recruitment Service — standalone stack for this repo only.
#
# `celestial-shared` below is a placeholder external network name for local
# dev. On the production server it's actually CRM's own compose-generated
# network (`celestial-crm_default`, from the CRM stack at /opt/celestial-crm)
# — set CELESTIAL_NETWORK_NAME=celestial-crm_default in .env there; no need
# to create a separate network, recruitment-api just joins CRM's existing one.

services:
  recruitment-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recruitment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-recruitment}
    volumes:
      - recruitment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruitment}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  recruitment-api:
    build: .
    restart: unless-stopped
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      recruitment-postgres:
        condition: service_healthy
    networks:
      - internal
      - celestial-shared
    # No ports published by default — reachable only from other containers on
    # celestial-shared (e.g. the CRM backend). Uncomment for local testing:
    # ports:
    #   - "8000:8000"

  recruitment-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python -m app.worker
    depends_on:
      recruitment-postgres:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge
  celestial-shared:
    external: true
    name: ${CELESTIAL_NETWORK_NAME:-celestial-shared}

volumes:
  recruitment-postgres-data:
